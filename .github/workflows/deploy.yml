# Test and deploy.
# - Every push to main, and every pull request: run all the checks (sheet, talent files, configs, and the database rules,
#   party and save checks in the Firebase emulators).
# - Pushes to main only: if every check passed, publish the database rules (firestore.rules), then put the site live on
#   Firebase Hosting. The rules go first, so a page that relies on newer rules never goes live ahead of them.
#   The rules step needs a one-time permission for the deploy account (see SPHERES_SHEET_NOTES.md, "GitHub and automatic deploys").
# Tool versions are pinned so a new release of a tool can't turn the checks red on its own; raise them on purpose.
name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5   # the Firebase emulators need Java
        with:
          distribution: temurin
          java-version: 21
      - name: Check the talent description files and the Firebase configs
        run: node tests/talents-check.js && node tests/config-check.js
      - name: Install the test tools
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0 firebase-tools@13.35.1 firebase@10.12.2 @firebase/rules-unit-testing@3.0.4
          npx playwright install --with-deps chromium
      - name: Check the rules engine directly (fast: no clicking)
        run: node tests/engine-check.js
      - name: Check the sheet (example characters, wiki text, adding talents...)
        run: node tests/check.js
      - name: Check the script policy against the page (tools/csp.js)
        run: node tests/csp-check.js
      - name: Check that hostile character data can't inject markup or scripts
        run: node tests/fuzz-check.js
      - name: Check the database rules (emulator)
        run: npx firebase emulators:exec --only firestore --project demo-spheres "node tests/rules-check.js"
      - name: Check share links and parties (emulator)
        run: npx firebase emulators:exec --config firebase.emulators.json --only firestore,auth --project demo-spheres "node tests/party-check.js"
      - name: Check how often the sheet saves (emulator)
        run: npx firebase emulators:exec --config firebase.emulators.json --only firestore,auth --project demo-spheres "node tests/save-check.js"

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-live
      cancel-in-progress: false
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5   # the deploy's own pre-check (firebase.json "predeploy") runs node
        with:
          node-version: 22
      # Publishes firestore.rules on every deploy (it changes nothing if the rules are already the same).
      # Needs the deploy account to have the "Firebase Rules Admin" role. If this step fails with a permission error,
      # the role is missing: see the notes. The site is not updated either, because the hosting step below doesn't run.
      # It only touches the rules: "--only firestore:rules" doesn't run the hosting pre-check, and it doesn't read the
      # hosting settings that the next step rewrites. The key file is deleted right after.
      - name: Save the deploy key for the rules step
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPHERES_CHARACTER_SHEET }}
        run: |
          umask 077
          printf '%s' "$SA" > "$RUNNER_TEMP/firebase-rules-key.json"
      - name: Publish the database rules (firestore.rules)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-rules-key.json
        run: npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project spheres-character-sheet --non-interactive
      - name: Delete the deploy key file
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-rules-key.json"
      - name: Add the script policy for this page (report-only; its hashes change with every edit)
        run: node tools/csp.js --write firebase.json
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPHERES_CHARACTER_SHEET }}
          channelId: live
          projectId: spheres-character-sheet
